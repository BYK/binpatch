<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="High-level architecture: your code calls resolveAndApply, which uses a pluggable SourceStrategy and returns the verified result.">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- call arrow -->
  <text x="60" y="170" text-anchor="middle" font-size="13" fill="currentColor">your code</text>
  <line x1="120" y1="166" x2="200" y2="166" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="160" y="158" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">call</text>

  <!-- binpatch library -->
  <rect x="200" y="40" width="360" height="240" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="220" y="64" font-size="13" font-weight="600" fill="currentColor">binpatch (this library)</text>

  <text x="220" y="100" font-size="13" font-weight="600" fill="currentColor">resolveAndApply:</text>

  <!-- SourceStrategy — centered horizontally in the box, with "pluggable" label directly attached -->
  <rect x="220" y="120" width="200" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="320" y="144" text-anchor="middle" font-size="12" fill="currentColor">SourceStrategy</text>
  <text x="320" y="162" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">.resolveChain()</text>

  <!-- "pluggable" badge attached to the SourceStrategy box -->
  <rect x="430" y="136" width="76" height="28" rx="14" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/>
  <text x="468" y="154" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.85">pluggable</text>

  <!-- arrow down to steps -->
  <line x1="320" y1="180" x2="320" y2="200" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- step labels — centered under the arrow -->
  <text x="320" y="218" text-anchor="middle" font-size="12" fill="currentColor">fetch patches</text>
  <text x="320" y="236" text-anchor="middle" font-size="12" fill="currentColor">apply each hop</text>
  <text x="320" y="254" text-anchor="middle" font-size="12" fill="currentColor">verify SHA-256</text>
  <text x="320" y="272" text-anchor="middle" font-size="12" fill="currentColor">emit ProgressEvents</text>

  <!-- return result — centered under the binpatch box -->
  <line x1="380" y1="280" x2="380" y2="304" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="380" y="318" text-anchor="middle" font-size="12" fill="currentColor">return result</text>
</svg>
