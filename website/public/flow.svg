<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="How an update flows: CI produces patches from the old binary, publishes them to a registry, the user's binary discovers and downloads them in parallel, then applies them in order to reconstruct the new binary.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- CI box -->
  <rect x="20" y="40" width="220" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="130" y="68" text-anchor="middle" font-size="14" fill="currentColor">binpatch Action (CI)</text>
  <text x="130" y="88" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">bsdiff old → new</text>

  <!-- old binary -->
  <text x="20" y="30" font-size="12" fill="currentColor" opacity="0.7">old binary (100 MB)</text>
  <line x1="60" y1="110" x2="130" y2="135" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- patch -->
  <text x="20" y="160" font-size="12" fill="currentColor" opacity="0.7">patch (70 KB) per hop</text>
  <line x1="60" y1="150" x2="130" y2="175" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- registry hub -->
  <circle cx="380" cy="130" r="40" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="380" y="126" text-anchor="middle" font-size="12" fill="currentColor">registry</text>
  <text x="380" y="142" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.7">GHCR / GH Releases</text>

  <!-- CI -> registry -->
  <line x1="240" y1="130" x2="340" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- registry -> binary (parallel) -->
  <line x1="420" y1="130" x2="540" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="480" y="122" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.7">download in parallel</text>

  <!-- binary box -->
  <rect x="540" y="100" width="160" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="620" y="126" text-anchor="middle" font-size="14" fill="currentColor">resolveAndApply()</text>
  <text x="620" y="146" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.7">apply in order</text>

  <!-- binary output -->
  <line x1="620" y1="160" x2="620" y2="200" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="620" y="225" text-anchor="middle" font-size="12" fill="currentColor">installed binary (100 MB)</text>
</svg>