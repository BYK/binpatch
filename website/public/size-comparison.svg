<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Measured on getsentry/cli 0.29.0 to 0.39.0. The typical (median) patch is 4.0% the size of the full gzipped binary — 1.32 MB versus 31.38 MB, saving 96% per update. Range across 8 release pairs: 0.9% (small fixes) to 8.1% (big features).">
  <style>
    .ink { fill: #14171c; }
    .muted { fill: #14171c; opacity: 0.55; }
    .faint { stroke: #14171c; opacity: 0.18; fill: none; }
    .accent { fill: #ff5a36; }
    .hatch-stroke-full { stroke: #14171c; stroke-opacity: 0.65; }
    .hatch-fill-full { fill: #14171c; fill-opacity: 0.06; }
    .hatch-stroke-patch { stroke: #ff5a36; }
    .hatch-fill-patch { fill: #ff5a36; fill-opacity: 0.10; }
    .stroke-ink { stroke: #14171c; stroke-opacity: 0.4; }
    .stroke-accent { stroke: #ff5a36; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6e8eb; }
      .muted { fill: #e6e8eb; opacity: 0.55; }
      .faint { stroke: #e6e8eb; opacity: 0.18; }
      .hatch-stroke-full { stroke: #e6e8eb; stroke-opacity: 0.65; }
      .hatch-fill-full { fill: #e6e8eb; fill-opacity: 0.06; }
      .hatch-fill-patch { fill: #ff5a36; fill-opacity: 0.14; }
      .stroke-ink { stroke: #e6e8eb; stroke-opacity: 0.4; }
    }
  </style>

  <defs>
    <pattern id="hatch-full" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" class="hatch-fill-full" />
      <line x1="0" y1="0" x2="0" y2="7" class="hatch-stroke-full" stroke-width="3" />
    </pattern>
    <pattern id="hatch-patch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <rect width="5" height="5" class="hatch-fill-patch" />
      <line x1="0" y1="0" x2="0" y2="5" class="hatch-stroke-patch" stroke-width="3" />
    </pattern>
  </defs>

  <!-- Full bar -->
  <text x="40" y="40" font-size="13" class="ink" font-weight="600">Full download</text>
  <text x="200" y="40" font-size="12" class="muted">gzipped · 31.38 MB</text>
  <rect x="40" y="52" width="800" height="22" rx="3" fill="url(#hatch-full)" class="stroke-ink" stroke-width="1" />
  <text x="40" y="94" font-size="13" class="ink" font-weight="600">Patch (TRDIFF10)</text>
  <text x="200" y="94" font-size="12" class="muted">1.32 MB</text>
  <!-- 4% of 800 = 32px wide -->
  <rect x="40" y="106" width="32" height="22" rx="3" fill="url(#hatch-patch)" class="stroke-accent" stroke-width="1" />
  <text x="80" y="123" font-size="12" class="accent" font-weight="700">4.0%</text>

  <!-- Horizontal separator -->
  <line x1="40" y1="180" x2="840" y2="180" class="faint" stroke-width="1" />

  <!-- Range section header -->
  <text x="40" y="214" font-size="13" font-weight="600" letter-spacing="0.5" class="ink">getsentry/cli · 8 release pairs</text>
  <text x="40" y="234" font-size="12" class="muted">Patch size as a percentage of the gzipped binary — median 4.0% (96% saved)</text>
</svg>
