<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="How an update flows: CI produces a patch from the old binary and publishes it to a registry, the user's binary downloads it in parallel with any other hops and applies them in order to reconstruct the new binary.">
  <style>
    .stroke { stroke: #14171c; }
    .stroke-faint { stroke: #14171c; opacity: 0.35; }
    .text { fill: #14171c; }
    .text-muted { fill: #14171c; opacity: 0.55; }
    .arrow { fill: #14171c; }
    @media (prefers-color-scheme: dark) {
      .stroke { stroke: #e6e8eb; }
      .stroke-faint { stroke: #e6e8eb; opacity: 0.35; }
      .text { fill: #e6e8eb; }
      .text-muted { fill: #e6e8eb; opacity: 0.55; }
      .arrow { fill: #e6e8eb; }
    }
  </style>
  <defs>
    <marker id="arr-home" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>

  <!-- column labels -->
  <text x="160" y="34" text-anchor="middle" font-size="13" font-weight="600" class="text" opacity="0.7">CI</text>
  <text x="560" y="34" text-anchor="middle" font-size="13" font-weight="600" class="text" opacity="0.7">user's machine</text>
  <line x1="60" y1="44" x2="260" y2="44" class="stroke-faint" stroke-width="1"/>
  <line x1="380" y1="44" x2="740" y2="44" class="stroke-faint" stroke-width="1"/>

  <!-- CI column -->
  <text x="160" y="80" text-anchor="middle" font-size="13" class="text">old binary (100 MB)</text>
  <line x1="160" y1="92" x2="160" y2="118" class="stroke" stroke-width="1.5" marker-end="url(#arr-home)"/>

  <rect x="60" y="124" width="200" height="60" rx="10" fill="none" class="stroke" stroke-width="1.5"/>
  <text x="160" y="150" text-anchor="middle" font-size="14" class="text">binpatch Action (CI)</text>
  <text x="160" y="170" text-anchor="middle" font-size="12" class="text" opacity="0.7">bsdiff old → new</text>

  <line x1="160" y1="184" x2="160" y2="208" class="stroke" stroke-width="1.5" marker-end="url(#arr-home)"/>
  <text x="160" y="226" text-anchor="middle" font-size="13" class="text">patch (70 KB)</text>

  <!-- registry hub (subtle) -->
  <text x="370" y="170" text-anchor="middle" font-size="11" class="text-muted">over the wire</text>
  <text x="370" y="188" text-anchor="middle" font-size="11" class="text-muted">(GHCR · GitHub Releases)</text>

  <!-- diagonal arrow from patch to resolveAndApply -->
  <line x1="245" y1="222" x2="455" y2="150" class="stroke" stroke-width="1.5" marker-end="url(#arr-home)"/>

  <!-- user column -->
  <rect x="460" y="118" width="200" height="60" rx="10" fill="none" class="stroke" stroke-width="1.5"/>
  <text x="560" y="144" text-anchor="middle" font-size="14" class="text">resolveAndApply()</text>
  <text x="560" y="164" text-anchor="middle" font-size="11" class="text" opacity="0.7">download (parallel) → apply (ordered)</text>

  <line x1="560" y1="178" x2="560" y2="204" class="stroke" stroke-width="1.5" marker-end="url(#arr-home)"/>
  <text x="560" y="222" text-anchor="middle" font-size="13" class="text">installed binary (100 MB)</text>
</svg>