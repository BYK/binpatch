<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="High-level architecture: your code calls resolveAndApply, which uses a pluggable SourceStrategy and returns the verified result.">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="60" y="180" text-anchor="middle" font-size="13" fill="currentColor">your code</text>
  <line x1="120" y1="176" x2="200" y2="176" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="160" y="168" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">call</text>

  <!-- binpatch library -->
  <rect x="200" y="40" width="360" height="240" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="220" y="64" font-size="13" font-weight="600" fill="currentColor">binpatch (this library)</text>

  <text x="220" y="100" font-size="13" font-weight="600" fill="currentColor">resolveAndApply:</text>

  <!-- SourceStrategy -->
  <rect x="240" y="118" width="160" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="320" y="140" text-anchor="middle" font-size="12" fill="currentColor">SourceStrategy</text>
  <text x="320" y="158" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">.resolveChain()</text>

  <line x1="320" y1="174" x2="320" y2="192" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr2)"/>

  <text x="500" y="146" text-anchor="end" font-size="11" fill="currentColor" opacity="0.7">← pluggable</text>

  <!-- steps -->
  <text x="220" y="210" font-size="12" fill="currentColor">fetch patches</text>
  <text x="220" y="230" font-size="12" fill="currentColor">apply each hop</text>
  <text x="220" y="250" font-size="12" fill="currentColor">verify SHA-256</text>
  <text x="220" y="270" font-size="12" fill="currentColor">emit ProgressEvents</text>

  <text x="380" y="304" text-anchor="middle" font-size="12" fill="currentColor">return result</text>
</svg>
