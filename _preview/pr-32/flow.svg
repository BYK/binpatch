<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="How an update flows: CI produces a patch from the old binary and publishes it to a registry, the user's binary downloads it in parallel with any other hops and applies them in order to reconstruct the new binary.">
  <defs>
    <marker id="arr-home" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- column labels -->
  <text x="160" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" opacity="0.7">CI</text>
  <text x="560" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" opacity="0.7">user's machine</text>
  <line x1="60" y1="44" x2="260" y2="44" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <line x1="380" y1="44" x2="740" y2="44" stroke="currentColor" stroke-width="1" opacity="0.35"/>

  <!-- CI column -->
  <text x="160" y="80" text-anchor="middle" font-size="13" fill="currentColor">old binary (100 MB)</text>
  <line x1="160" y1="92" x2="160" y2="118" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr-home)"/>

  <rect x="60" y="124" width="200" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="160" y="150" text-anchor="middle" font-size="14" fill="currentColor">binpatch Action (CI)</text>
  <text x="160" y="170" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">bsdiff old → new</text>

  <line x1="160" y1="184" x2="160" y2="204" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr-home)"/>
  <text x="160" y="222" text-anchor="middle" font-size="13" fill="currentColor">patch (70 KB)</text>

  <!-- registry hub (subtle) -->
  <text x="370" y="160" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">over the wire</text>
  <text x="370" y="178" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">(GHCR · GitHub Releases)</text>

  <!-- horizontal arrow from patch to resolveAndApply -->
  <line x1="245" y1="218" x2="455" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr-home)"/>

  <!-- user column -->
  <rect x="460" y="118" width="200" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="560" y="144" text-anchor="middle" font-size="14" fill="currentColor">resolveAndApply()</text>
  <text x="560" y="164" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">download (parallel) → apply (ordered)</text>

  <line x1="560" y1="178" x2="560" y2="198" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr-home)"/>
  <text x="560" y="216" text-anchor="middle" font-size="13" fill="currentColor">installed binary (100 MB)</text>
</svg>