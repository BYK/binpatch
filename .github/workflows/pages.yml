name: Pages

# Deploys website/ to GitHub Pages.
#
# Production builds on push: main and publishes to the `gh-pages` branch.
# PR previews are handled by docs-preview.yml (same branch, `_preview`
# umbrella dir) so both live on one Pages source and never race.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Ensure .nojekyll at gh-pages root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            if git show gh-pages:.nojekyll &>/dev/null; then
              echo ".nojekyll already exists at gh-pages root"
            else
              echo "Adding .nojekyll to existing gh-pages branch"
              git checkout gh-pages
              touch .nojekyll
              git add .nojekyll
              git commit -m "Add .nojekyll to disable Jekyll processing"
              git push origin gh-pages
              git checkout "$GITHUB_SHA"
            fi
          else
            echo "Creating gh-pages branch with .nojekyll"
            git checkout --orphan gh-pages
            git rm -rf .
            touch .nojekyll
            git add .nojekyll
            git commit -m "Initialize gh-pages with .nojekyll"
            git push origin gh-pages
            git checkout "$GITHUB_SHA"
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: website/dist
          branch: gh-pages
          clean-exclude: _preview
          force: false

  # Link-check every internal href in the built site so a stray
  # "architecture/security/" or broken Starlight pagination URL is
  # caught in CI, not by a reader who clicks through.
  link-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hyperlink
        run: python -m pip install --user hyperlink

      - name: Find broken internal links in dist/
        # --internal-only: only follow same-origin links (the docs
        # site is what we control); --skip-fragment: ignore #anchors
        # (we don't generate static ids for every section).
        run: |
          python -m hyperlink \
            --internal-only \
            --skip-fragment \
            website/dist/index.html \
            website/dist/architecture/index.html \
            website/dist/apply/index.html \
            website/dist/discover/index.html \
            website/dist/getting-started/index.html \
            website/dist/installation/index.html \
            website/dist/github-action/index.html \
            website/dist/ci-integration/index.html \
            website/dist/custom-fetch/index.html \
            website/dist/telemetry/index.html \
            website/dist/progress/index.html \
            website/dist/faq/index.html \
            website/dist/security/index.html \
            website/dist/contributing/index.html \
            > link-check.json
          cat link-check.json
          # hyperlink exits non-zero only on tool errors; failures go
          # to stdout. Fail the job if any 4xx/5xx result was found.
          if grep -q '"result":.*\(4[0-9][0-9]\|5[0-9][0-9]\)' link-check.json; then
            echo "::error::Broken internal links found (see link-check.json)"
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: link-check-report
          path: link-check.json
          retention-days: 7
