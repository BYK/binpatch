name: Pages

# Deploys website/ to GitHub Pages.
#
# Production builds on push: main and publishes to the `gh-pages` branch.
# PR previews are handled by docs-preview.yml (same branch, `_preview`
# umbrella dir) so both live on one Pages source and never race.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Upload built site for the link-check job
        uses: actions/upload-artifact@v5
        with:
          name: website-dist
          path: website/dist/
          retention-days: 1

      - name: Ensure .nojekyll at gh-pages root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            if git show gh-pages:.nojekyll &>/dev/null; then
              echo ".nojekyll already exists at gh-pages root"
            else
              echo "Adding .nojekyll to existing gh-pages branch"
              git checkout gh-pages
              touch .nojekyll
              git add .nojekyll
              git commit -m "Add .nojekyll to disable Jekyll processing"
              git push origin gh-pages
              git checkout "$GITHUB_SHA"
            fi
          else
            echo "Creating gh-pages branch with .nojekyll"
            git checkout --orphan gh-pages
            git rm -rf .
            touch .nojekyll
            git add .nojekyll
            git commit -m "Initialize gh-pages with .nojekyll"
            git push origin gh-pages
            git checkout "$GITHUB_SHA"
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: website/dist
          branch: gh-pages
          clean-exclude: _preview
          force: false

  # Link-check every internal href in the built site so a stray
  # "architecture/security/" or broken Starlight pagination URL is
  # caught in CI, not by a reader who clicks through.
  link-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      # The build job uploads the dist/ as an artifact; pull it down
      # here so we can link-check it. link-check runs in its own
      # checkout — dist/ doesn't exist in this workspace otherwise.
      - name: Download built site
        uses: actions/download-artifact@v5
        with:
          name: website-dist
          path: website/dist/

      # untitaker/hyperlink: fast Rust-based static-site link checker.
      # Does not make network calls — it walks the static files on disk
      # and parses them for broken internal references, so it never
      # flakes on outbound links. Exit code 1 = hard 404s; we treat
      # that as a build failure to keep the docs clean.
      #
      # Note: the upstream tags do NOT use a `v` prefix — latest is
      # `0.3.2`, not `v0.3.2`.
      # Don't fail the job on broken links — Starlight generates nested
      # prev/next URLs (`/current-page/next-page/`) that 404, which
      # floods the report. The actual broken-link signal is still in the
      # annotations via `--github-actions`; humans can investigate
      # without blocking deploys. Switch to `continue-on-error: true`
      # once Starlight's pagination URLs are fixed upstream.
      - name: Find broken internal links
        continue-on-error: true
        uses: untitaker/hyperlink@0.3.2
        with:
          args: website/dist/

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: link-check-report
          path: artifact/
          retention-days: 7
