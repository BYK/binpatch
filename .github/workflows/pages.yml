name: Pages

# Deploys website/ to GitHub Pages.
#
# Production builds on push: main and publishes to the `gh-pages` branch.
# PR previews are handled by docs-preview.yml (same branch, `_preview`
# umbrella dir) so both live on one Pages source and never race.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Ensure .nojekyll at gh-pages root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            if git show gh-pages:.nojekyll &>/dev/null; then
              echo ".nojekyll already exists at gh-pages root"
            else
              echo "Adding .nojekyll to existing gh-pages branch"
              git checkout gh-pages
              touch .nojekyll
              git add .nojekyll
              git commit -m "Add .nojekyll to disable Jekyll processing"
              git push origin gh-pages
              git checkout "$GITHUB_SHA"
            fi
          else
            echo "Creating gh-pages branch with .nojekyll"
            git checkout --orphan gh-pages
            git rm -rf .
            touch .nojekyll
            git add .nojekyll
            git commit -m "Initialize gh-pages with .nojekyll"
            git push origin gh-pages
            git checkout "$GITHUB_SHA"
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: website/dist
          branch: gh-pages
          clean-exclude: _preview
          force: false
