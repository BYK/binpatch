name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (or "auto")
        required: false
      force:
        description: Force a release even when there are release-blockers
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    name: Prepare release
    environment: production
    permissions:
      contents: write
      issues: write
      id-token: write # OIDC for the publish handoff
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # Craft runs `craft prepare` → opens a release-request issue with
      # the proposed version + changelog. Maintainers review the issue,
      # label it `accepted` (Craft looks for this label), and the
      # `accepted` label triggers `.github/workflows/publish.yml` via
      # GitHub's `release: published` webhook once Craft cuts the release.
      - uses: getsentry/craft@v2
        with:
          version: ${{ inputs.version }}
          force: ${{ inputs.force }}
          publish_repo: self
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
